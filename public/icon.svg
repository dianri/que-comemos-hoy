<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente cálido -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Plato central decorativo -->
  <g filter="url(#shadow)">
    <!-- Borde exterior del plato -->
    <circle cx="256" cy="256" r="160" fill="#ffffff" opacity="0.95"/>
    <!-- Borde interior del plato -->
    <circle cx="256" cy="256" r="128" fill="#fff7ed"/>
    <!-- Fondo hondo del plato -->
    <circle cx="256" cy="256" r="105" fill="#ffedd5"/>
  </g>

  <!-- Tenedor izquierdo -->
  <g fill="#ea580c">
    <!-- Mango tenedor -->
    <rect x="180" y="240" width="12" height="110" rx="6"/>
    <!-- Base tenedor -->
    <path d="M 170 200 C 170 240, 202 240, 202 200 Z"/>
    <!-- Dientes tenedor -->
    <rect x="170" y="160" width="6" height="45" rx="3"/>
    <rect x="183" y="160" width="6" height="45" rx="3"/>
    <rect x="196" y="160" width="6" height="45" rx="3"/>
  </g>

  <!-- Cuchillo derecho -->
  <g fill="#ea580c">
    <!-- Mango cuchillo -->
    <rect x="320" y="240" width="12" height="110" rx="6"/>
    <!-- Hoja cuchillo -->
    <path d="M 320 160 Q 338 180 338 235 L 320 235 Z"/>
  </g>

  <!-- Destello o estrella culinaria -->
  <path d="M 256 220 Q 256 244 232 244 Q 256 244 256 268 Q 256 244 280 244 Q 256 244 256 220 Z" fill="#f97316"/>
</svg>
